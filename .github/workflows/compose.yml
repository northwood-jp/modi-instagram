name: compose-instagram

on:
  schedule:
    - cron: '0 */6 * * *'   # 6時間おき
  workflow_dispatch:         # 手動でも動かせる

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 日本語のフォントを入れる
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
      - name: 必要な部品を入れる
        run: pip install pillow numpy requests
      - name: 画像を作る
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_TOKEN: ${{ secrets.GAS_TOKEN }}
        run: python compose.py
      - name: 画像を保存する
        run: |
          git config user.name "modi-bot"
          git config user.email "modi-bot@users.noreply.github.com"
          git add images manifest.json || true
          git diff --cached --quiet || (git commit -m "画像を作成" && git push)
      - name: スプレッドシートに知らせる
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_TOKEN: ${{ secrets.GAS_TOKEN }}
        run: python notify.py
